<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập K4: Phân Trang Danh Sách</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    h2 {
      color: #333;
    }

    /* Khung danh sách */
    #item-list {
      list-style-type: none;
      padding: 0;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    #item-list li {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
    }

    #item-list li:last-child {
      border-bottom: none;
    }

    /* Các nút phân trang */
    .pagination {
      display: flex;
      gap: 8px;
    }

    .pagination button {
      padding: 8px 14px;
      border: 1px solid #007bff;
      background-color: #fff;
      color: #007bff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .pagination button:hover {
      background-color: #e6f0ff;
    }

    .pagination button.active {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Bài tập K4: Phân Trang Danh Sách</h2>

  <!-- Danh sách hiển thị mục -->
  <ul id="item-list"></ul>

  <!-- Cụm nút phân trang -->
  <div class="pagination" id="pagination"></div>

  <script>
    // 1. Tạo mảng dữ liệu giả lập gồm 50 mục
    const data = Array.from({ length: 50 }, (_, i) => `Mục ${i + 1}`);

    const itemsPerPage = 10;
    let currentPage = 1;

    const listElement = document.getElementById('item-list');
    const paginationElement = document.getElementById('pagination');

    // 2. Hàm hiển thị danh sách mục cho trang hiện tại
    function displayList(page) {
      listElement.innerHTML = '';
      
      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageItems = data.slice(startIndex, endIndex);

      pageItems.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        listElement.appendChild(li);
      });
    }

    // 3. Hàm tạo các nút phân trang (1, 2, 3...)
    function setupPagination() {
      paginationElement.innerHTML = '';
      const totalPages = Math.ceil(data.length / itemsPerPage);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;

        if (i === currentPage) {
          btn.classList.add('active');
        }

        // Sự kiện khi bấm vào nút trang
        btn.addEventListener('click', () => {
          currentPage = i;
          displayList(currentPage);

          // Cập nhật class active cho nút vừa bấm
          document.querySelector('.pagination button.active')?.classList.remove('active');
          btn.classList.add('active');
