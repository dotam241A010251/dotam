<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập K4: Phân Trang Danh Sách</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    /* Danh sách hiển thị các mục */
    #item-list {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    #item-list li {
      padding: 14px 20px;
      border-bottom: 1px solid #edf2f7;
      transition: background-color 0.2s;
    }

    #item-list li:last-child {
      border-bottom: none;
    }

    #item-list li:hover {
      background-color: #f7fafc;
    }

    /* Vùng chứa các nút phân trang */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid #cbd5e0;
      background-color: #ffffff;
      color: #4a5568;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pagination button:hover {
      background-color: #edf2f7;
      border-color: #cbd5e0;
    }

    /* Nút đang chọn */
    .pagination button.active {
      background-color: #3182ce;
      color: #ffffff;
      border-color: #3182ce;
    }
  </style>
</head>
<body>

  <h2>Bài tập K4: Phân Trang Danh Sách</h2>

  <!-- Danh sách 10 mục của trang hiện tại -->
  <ul id="item-list"></ul>

  <!-- Các nút phân trang (1, 2, 3...) -->
  <div class="pagination" id="pagination"></div>

  <script>
    // 1. Dữ liệu giả lập gồm 50 mục
    const items = Array.from({ length: 50 }, (_, index) => `Mục ${index + 1}`);
    
    const itemsPerPage = 10;
    let currentPage = 1;

    const listElement = document.getElementById('item-list');
    const paginationElement = document.getElementById('pagination');

    // 2. Hàm hiển thị danh sách 10 mục tương ứng với trang hiện tại
    function renderList(page) {
      listElement.innerHTML = '';
      
      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const currentItems = items.slice(startIndex, endIndex);

      currentItems.forEach(itemText => {
        const li = document.createElement('li');
        li.textContent = itemText;
        listElement.appendChild(li);
      });
    }

    // 3. Hàm tạo danh sách các nút phân trang
    function renderPagination() {
      paginationElement.innerHTML = '';
      const totalPages = Math.ceil(items.length / itemsPerPage);

      for (let i = 1; i <= totalPages; i++) {
	  const button = document.createElement('button');
        button.textContent = i;

        if (i === currentPage) {
          button.classList.add('active');
        }

        button.addEventListener('click', () => {
          currentPage = i;
          renderList(currentPage);
          
          // Cập nhật trạng thái 'active' cho nút vừa bấm
          document.querySelector('.pagination button.active')?.classList.remove('active');
          button.classList.add('active');
        });

        paginationElement.appendChild(button);
      }
    }

    // Khởi chạy ứng dụng
    renderList(currentPage);
    renderPagination();
  </script>

</body>
</html>
